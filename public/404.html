<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PracticeOS</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrite for client-side routes, so
      // a direct link or refresh at e.g. /CA-Firm-Automation/clients/123
      // hits this 404 page instead of index.html. This encodes the real
      // path into a query string and redirects to index.html, which
      // decodes it back (see the script in index.html) before React Router
      // ever sees the URL. Standard pattern: https://github.com/rafgraph/spa-github-pages

      // Number of path segments that are the GitHub Pages project path
      // (the repo name) rather than part of the app's own routing —
      // must match vite.config.ts's `base`.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
